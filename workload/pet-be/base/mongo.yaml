apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pet-mongo
  template:
    metadata:
      labels:
        app: pet-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pet-mongo
spec:
  selector:
    app: pet-mongo
  ports:
    - port: 27017
      targetPort: 27017
