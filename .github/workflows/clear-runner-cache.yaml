name: clear-runner-cache

on:
  workflow_dispatch:

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Clear all Actions cache for this repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --repo ${{ github.repository }} --json id -q '.[].id' | \
            xargs -I{} gh cache delete {} --repo ${{ github.repository }}
