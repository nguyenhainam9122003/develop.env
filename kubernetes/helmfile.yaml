# Ví dụ minh hoạ: nơi khai báo các Helm chart bên thứ 3 để cài qua `helmfile sync`.
# Trong repo thật, ArgoCD có thể trỏ trực tiếp vào Helm chart (Application source type Helm)
# thay vì cần Helmfile riêng — Helmfile hữu ích khi cần quản lý NHIỀU chart cùng lúc,
# theo dõi version tập trung ở 1 chỗ.

repositories:
  - name: jetstack
    url: https://charts.jetstack.io

releases:
  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.16.2
    values:
      - crds:
          enabled: true
